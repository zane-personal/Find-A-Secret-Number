<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find a secret Number (While Loops JavaScript)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--main container-->
    <div class="container">
        <h1 class="title">Find A secret Number</h1>

        <input type="number" id="number" name="number" class="input-fields" placeholder="Enter a number" min="0">


        <button id="btn" class="login-btn">CHECK NUMBER</button>
    </div>


    <div id="customModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modalTitle" class="modal-title">Login Successful</h3>
            
        <input type="number" id="number" name="number" class="input-fields" placeholder="Enter a number" min="0">
            <button onclick="closeModal()" class="modal-close-btn">
                Close
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
